name: PR title

# Its own workflow rather than a job in ci.yml: that file is paths-filtered,
# and traceability should be checked on every pull request — including one
# that only touches the frontend or the docs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  title-format:
    name: PR title is a conventional commit, with a story ID where one applies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the title
        env:
          # Passed as an environment variable, never interpolated into the
          # script below: a pull request title containing $(...) or backticks
          # would otherwise execute on the runner.
          TITLE: ${{ github.event.pull_request.title }}
          # Conventional Commits, with the Jira story as the scope:
          #   feat(SCRUM-19): submit an event request
          # Product and code work must name its story — a pull request nobody
          # can trace to a story is the thing this check exists to catch.
          STORY_PATTERN: '^(feat|fix|docs|refactor|test|perf|style|revert)\(SCRUM-[0-9]+\): .+'
          # Tooling work (pipelines, dependencies, housekeeping) often has no
          # story, so its scope is optional — but when given, it must be a story
          # (Dependabot's prefixes in dependabot.yml are unscoped for this reason).
          #   ci: cache pip downloads
          #   ci(SCRUM-5): add backend CI pipeline
          TOOLING_PATTERN: '^(ci|build|chore)(\(SCRUM-[0-9]+\))?: .+'
        run: |
          echo "Title: $TITLE"
          if printf '%s' "$TITLE" | grep -Eq "$STORY_PATTERN"; then
            exit 0
          fi
          if printf '%s' "$TITLE" | grep -Eq "$TOOLING_PATTERN"; then
            exit 0
          fi
          echo "::error::Title must read like 'feat(SCRUM-19): submit an event request'. feat|fix|docs|refactor|test|perf|style|revert need (SCRUM-<id>); ci|build|chore may leave it out, e.g. 'ci: cache pip downloads'. Then a colon, a space and a summary."
          exit 1
