name: PR title

# Its own workflow rather than a job in ci.yml: a title is fixed by editing
# it, so this has to re-run on `edited`, and nothing else in the pipeline
# should. It runs on every pull request, whatever branch it targets, so a
# pull request stacked on another branch is checked as soon as it is opened.
# `synchronize` stays: a required check needs a result for every new head.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title-format:
    name: PR title is a conventional commit, with a story ID where one applies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the title
        env:
          # Passed as an environment variable, never interpolated into the
          # script below: a pull request title containing $(...) or backticks
          # would otherwise execute on the runner.
          TITLE: ${{ github.event.pull_request.title }}
          # Conventional Commits, with the Jira story as the scope:
          #   feat(SCRUM-19): submit an event request
          # Work on the product or the codebase must name its story — a pull
          # request nobody can trace to a story is the thing this check exists
          # to catch. That includes chore: exempting it would make it the easy
          # way to skip the link on real work.
          STORY_PATTERN: '^(feat|fix|docs|chore|refactor|test|perf|style|revert)\(SCRUM-[0-9]+\): .+'
          # Pipeline and dependency work (including Dependabot's weekly PRs)
          # often has no story, so its scope is optional — but when given, it
          # must be a story (Dependabot's prefixes are unscoped for this reason).
          #   ci: cache pip downloads
          #   build: bump the python group with 3 updates
          #   ci(SCRUM-5): add backend CI pipeline
          TOOLING_PATTERN: '^(ci|build)(\(SCRUM-[0-9]+\))?: .+'
        run: |
          echo "Title: $TITLE"
          if printf '%s' "$TITLE" | grep -Eq "$STORY_PATTERN"; then
            exit 0
          fi
          if printf '%s' "$TITLE" | grep -Eq "$TOOLING_PATTERN"; then
            exit 0
          fi
          echo "::error::Title must read like 'feat(SCRUM-19): submit an event request'. feat|fix|docs|chore|refactor|test|perf|style|revert need (SCRUM-<id>); ci|build may leave it out, e.g. 'ci: cache pip downloads'. Then a colon, a space and a summary."
          exit 1
