name: CI

# Every pull request, whatever branch it targets, and every push to main.
#
# No branch filter under pull_request: a pull request stacked on another
# branch gets its checks straight away, not only once it is retargeted to
# main. No paths filter either: the jobs below are meant to be required
# status checks, and a paths filter skips the whole workflow on a docs-only
# pull request, so its checks never report and the merge is blocked for good.
# A docs-only run costs a few minutes; a stuck pull request costs an admin.
# The PR title check lives in pr-title.yml because it has to re-run when the
# title is edited, and nothing else here should.
on:
  push:
    branches: [main]
  pull_request:

  # Lets anyone re-run the pipeline from the Actions tab, on any branch.
  workflow_dispatch:

# Narrower than the default token scope. Only the backend job widens it, to
# post the coverage comment on a pull request.
permissions:
  contents: read

# A second push to a pull request makes the first run pointless, so cancel it.
# Pushes to main are never cancelled: each commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint + static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Rules and exemptions live in backend/ruff.toml. Two of the rulesets
      # enabled there replace jobs this pipeline would otherwise need: `S`
      # (bandit) is the security lint, and `DTZ` is what holds ADR-0001 —
      # it rejects date.today() and naive datetime.now() outright, so no test
      # run has to gamble on the calendar to catch a stray server-clock read.
      # --output-format=github turns each finding into an inline annotation on
      # the pull request.
      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      # Catches a requirements pin that contradicts another package's metadata
      # before it becomes a confusing runtime import error.
      - name: Check for conflicting dependency pins
        run: pip check

  backend:
    name: Backend — migrate + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Widened from the workflow default for the coverage comment. GitHub
    # grants permissions per job, not per step, and a job's list replaces the
    # workflow's rather than adding to it, hence contents: read again.
    permissions:
      contents: read
      pull-requests: write

    # Postgres is started and migrated on every run even though the current
    # unit suite mocks the DB, so integration tests can be dropped in next
    # sprint without touching the pipeline. When they arrive, point
    # TEST_DATABASE_URL at this same container: TestingConfig reads it and
    # otherwise falls back to an in-memory SQLite database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectsphere -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: wsgi
      FLASK_ENV: development
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
      DATABASE_URL: postgresql+psycopg2://connectsphere:ci-password@localhost:5432/connectsphere_ci

    defaults:
      run:
        working-directory: backend

    steps:
      # Full history, so the base the pull request was merged into (HEAD^1,
      # see the diff-cover step) and everything below it are here to diff
      # against.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Two people branching off the same revision and each adding a migration
      # leaves Alembic with two heads once both merge, and every later
      # `flask db upgrade` fails for the whole team. `flask db check` does not
      # catch this. Alembic logs to stderr, so stdout is just the revisions.
      - name: Exactly one migration head
        run: |
          heads=$(flask db heads | grep -c .)
          if [ "$heads" -ne 1 ]; then
            flask db heads
            echo "::error::$heads migration heads — merge them with 'flask db merge'"
            exit 1
          fi

      - name: Run database migrations
        run: flask db upgrade

      - name: Verify migrations are complete (no pending model changes)
        run: flask db check

      # Every downgrade so far hand-drops the Postgres enum type that
      # drop_table leaves behind. Nothing proved that care survives the next
      # migration, so replay the whole history backwards and forwards.
      - name: Verify migrations are reversible
        run: |
          flask db downgrade base
          flask db upgrade

      # Ahead of the test suite on purpose: the suite mocks the database and
      # builds no test client, so a blueprint registered under the wrong
      # prefix or an extension that fails to initialise is invisible to it.
      # This is the only step that proves the app serves, and it answers in
      # seconds — no reason to spend a full test run before finding out.
      - name: Boot the app and smoke-test /health
        run: |
          flask run --host 127.0.0.1 --port 5000 &
          app_pid=$!
          # Not named `status`: that is read-only in zsh, so the snippet would
          # fail for anyone pasting it into a macOS terminal to debug it.
          smoke_status=0
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS \
            http://127.0.0.1:5000/health || smoke_status=$?
          kill "$app_pid" 2>/dev/null || true
          exit "$smoke_status"

      # No TZ is pinned here. Business dates come from
      # app.common.clock.local_today(), which converts from UTC through
      # APP_TIMEZONE and never reads the server clock, and ruff's DTZ rules
      # fail the lint job if anything reaches for date.today() instead. The
      # runner's UTC clock already disagrees with Asia/Singapore for most of
      # the day, so this run doubles as the check that nothing depends on the
      # two matching.
      - name: Run unit tests with coverage
        id: tests
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --junitxml=junit.xml

      # The 90% floor above is for the whole codebase, so a pull request can
      # add a function with no tests at all and still pass it. This holds
      # every line the pull request adds or changes to 100% (CONVENTIONS.md
      # §14). A line marked `# pragma: no cover - <reason>` is left out of the
      # count, which is how a deliberate gap is declared, with its reason.
      # diff-cover counts lines, not branches: an `if` tested only one way
      # still passes here, so that part stays with the reviewer (checklist §10).
      #
      # HEAD on a pull_request run is GitHub's merge of the branch into the
      # pull request's base, so HEAD^1 is that base as it stood when the run
      # started. github.base_ref is not the same thing: for a pull request in
      # a stack it names the branch the whole stack ends in (main), and
      # diffing against that counted every lower pull request's lines too.
      # The JSON copy is for the headline figure in the coverage report.
      - name: Changed lines are fully covered
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=HEAD^1 --fail-under=100 --format markdown:diff-cover.md,json:diff-cover.json

      # One report for the run's summary page and the pull request comment,
      # so nobody has to download the artifact to see where a number moved.
      # Written whenever the tests ran, pass or fail; skipped if an earlier
      # step failed before they could, since there is nothing to report.
      - name: Write the coverage report
        id: report
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          {
            echo "## Backend coverage"
            echo
            echo "- **Overall:** $(coverage report --format=total)% (floor 90%)"
            # Only pull requests have it: the changed-lines figure, and any line left uncovered.
            if [ -f diff-cover.json ]; then
              echo "- **Changed lines:** $(jq .total_percent_covered diff-cover.json)% (must be 100%)"
            fi
            echo
            echo "<details><summary>Per-file coverage</summary>"
            echo
            coverage report --format=markdown
            echo
            echo "</details>"
            if [ -f diff-cover.md ]; then
              echo
              cat diff-cover.md
            fi
          } > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # The same report as one comment on the pull request, edited in place on
      # each push rather than posted again. --edit-last finds the workflow's
      # own earlier comment (nothing else in this repo comments as the Actions
      # bot) and --create-if-none covers the first run. A pull request from a
      # fork gets a read-only token, so the step is skipped for one; the run
      # summary still has the report. continue-on-error: the coverage gates
      # have already run, and a failure to post a comment must not turn a
      # green build red once this job is a required check. Dependabot's pull
      # requests also get a read-only token, so on those this step fails and
      # is ignored.
      - name: Post the coverage report on the pull request
        if: >-
          always() && github.event_name == 'pull_request'
          && steps.report.outcome == 'success'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body-file coverage-report.md --edit-last --create-if-none

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/junit.xml
            backend/diff-cover.md

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory on purpose. A CVE published against Flask mid-sprint should be
    # visible on the run, not a wall between a finished story and the demo.
    # Drop this line once someone owns triaging the findings.
    continue-on-error: true

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # pip-audit reads the requirements file rather than the installed
      # environment, so this job needs the tool and nothing else. The version
      # still comes from requirements-dev.txt, so there is one place to bump.
      - name: Install pip-audit
        run: pip install "$(grep -E '^pip-audit==' requirements-dev.txt)"

      # The production dependency set is what ships; the dev tools are only
      # ever on a runner or a laptop. Add requirements-dev.txt here too if that
      # stops being true.
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
