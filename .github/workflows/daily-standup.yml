name: Daily Standup Reminder

on:
  schedule:
    # Runs at 04:10 UTC = 12:10 SGT, Monday-Friday
    - cron: '10 4 * * 1-5'
  workflow_dispatch: {}  # lets you trigger it manually to test

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send standup reminder to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.8737042185:AAEH3FZwf6OhLJK43nKIWaEr_D14yG5cXZk}}/sendMessage" \
            -d chat_id="${{ secrets.-5540230258 }}" \
            -d text="📅 Daily Standup
1️⃣ What did you do yesterday?
2️⃣ What are you doing today?
3️⃣ Any blockers?"
