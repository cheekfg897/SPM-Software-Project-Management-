name: Frontend

# Every pull request, whatever branch it targets, and every push to main, the same
# triggers as ci.yml and for the same reasons: a pull request stacked on another branch
# gets its checks straight away, and with no paths filter these jobs can be required
# status checks without blocking a pull request that doesn't touch the frontend. The
# integration job checks the frontend's API calls against the real backend, so backend
# changes need it too. The three jobs match the three test layers in frontend/CLAUDE.md.
on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: Frontend — lint, types, unit + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history, so diff-cover can find where the pull request branched off.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      # Fails under the 90% floor set in vite.config.ts.
      - name: Unit and component tests with coverage
        run: npm run test:coverage

      # The floor above is for the whole app, so a pull request could add an untested
      # component and still pass it. This holds every line it adds or changes to 100%,
      # as the backend job does. A line marked `/* v8 ignore next -- <reason> */` is left
      # out of the report, so it doesn't count against this.
      - name: Changed lines are fully covered
        if: github.event_name == 'pull_request'
        run: |
          pipx run diff-cover coverage/cobertura-coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} --fail-under=100

      - name: Build
        run: npm run build

  integration:
    name: Frontend — integration tests against the backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: connectsphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectsphere -d connectsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: wsgi
      FLASK_ENV: development
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
      DATABASE_URL: postgresql+psycopg2://connectsphere:ci-password@localhost:5432/connectsphere_ci
      BACKEND_URL: http://127.0.0.1:5000
      # The staff account the integration tests sign in as (see "Create a staff account").
      INTEGRATION_STAFF_EMAIL: integration-coordinator@connectsphere.test
      # The other staff accounts (see "Create the Lead, Venue Staff and Safety Officer accounts").
      INTEGRATION_LEAD_EMAIL: integration-lead@connectsphere.test
      INTEGRATION_VENUE_STAFF_EMAIL: integration-venue-staff@connectsphere.test
      INTEGRATION_SAFETY_OFFICER_EMAIL: integration-safety-officer@connectsphere.test
      INTEGRATION_TECH_SUPPORT_EMAIL: integration-tech-support@connectsphere.test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and migrate the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flask db upgrade

      # Only staff may record the client organisations that organisers sign up to, and staff
      # accounts only come from this command (ADR-0023), so the tests get one here. Its
      # password is made up for this run, hidden from the log and never written to the repo.
      - name: Create a staff account for the tests
        working-directory: backend
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          printf '%s\n%s\n' "$password" "$password" | flask create-staff-user \
            --email "$INTEGRATION_STAFF_EMAIL" --full-name "Integration Coordinator" \
            --role event_coordinator
          echo "INTEGRATION_STAFF_PASSWORD=$password" >> "$GITHUB_ENV"

      # The safety checks (SCRUM-97, SCRUM-98) need an event in Safety Review, which takes a Lead
      # to assign it and Venue Staff to approve its venue, and a Safety Officer to answer. They
      # are made the same way, each with its own password for this run. The Venue Staff account
      # also runs the SCRUM-43 decision checks that skip without one, and the Technical Support
      # account the SCRUM-48 equipment outcome checks that skip without one.
      - name: Create the Lead, Venue Staff and Safety Officer accounts for the tests
        working-directory: backend
        run: |
          create_account() {
            local role="$1" email="$2" full_name="$3" password_variable="$4"
            local password
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            printf '%s\n%s\n' "$password" "$password" | flask create-staff-user \
              --email "$email" --full-name "$full_name" --role "$role"
            echo "$password_variable=$password" >> "$GITHUB_ENV"
          }
          create_account event_coordinator_lead "$INTEGRATION_LEAD_EMAIL" \
            "Integration Lead" INTEGRATION_LEAD_PASSWORD
          create_account venue_staff "$INTEGRATION_VENUE_STAFF_EMAIL" \
            "Integration Venue Staff" INTEGRATION_VENUE_STAFF_PASSWORD
          create_account safety_officer "$INTEGRATION_SAFETY_OFFICER_EMAIL" \
            "Integration Safety Officer" INTEGRATION_SAFETY_OFFICER_PASSWORD
          create_account technical_support_staff "$INTEGRATION_TECH_SUPPORT_EMAIL" \
            "Integration Technical Support" INTEGRATION_TECH_SUPPORT_PASSWORD

      # Left running in the background for the next step; the runner stops it at the end.
      - name: Start the backend
        working-directory: backend
        run: |
          flask run --host 127.0.0.1 --port 5000 > flask.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS "$BACKEND_URL/health"

      - name: Install frontend dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

      - name: Backend log
        if: failure()
        working-directory: backend
        run: cat flask.log

  e2e:
    name: Frontend — end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
