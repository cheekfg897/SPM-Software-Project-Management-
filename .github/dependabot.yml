# Weekly dependency pull requests. Everything is grouped into one PR per
# ecosystem so the team reviews a single update a week instead of five.
# Prefixes carry no scope: pr-title.yml only accepts a SCRUM story as a scope,
# and ci/chore titles may omit it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
