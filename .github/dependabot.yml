# Weekly dependency pull requests. Everything is grouped into one PR per
# ecosystem so the team reviews a single update a week instead of five.
# Prefixes are ci/build with no scope: those are the only PR title types
# pr-title.yml lets go without a SCRUM story, and a scope must be a story.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
