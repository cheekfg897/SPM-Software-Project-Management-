[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
# One marker per user story so tests can be traced back to the backlog.
markers =
    scrum_6: tests for SCRUM-6 "log in to the system"
    scrum_19: tests for SCRUM-19 "submit an event request"
    scrum_21: tests for SCRUM-21 "enforce permissions for every role"
    scrum_25: tests for SCRUM-25 "update venue catalogue"
    scrum_65: tests for SCRUM-65 "create an account to access the system"
filterwarnings =
    error::DeprecationWarning:app.*
