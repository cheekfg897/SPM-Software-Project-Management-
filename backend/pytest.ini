[pytest]
testpaths = tests
addopts = -ra --strict-markers
# One marker per user story so tests can be traced back to the backlog.
# TODO: replace marker/story name with the actual Jira story ID once assigned
markers =
    story_create_account: tests for the "create an account" story
    story_login: tests for the "log in" story
    story_permissions: tests for the "enforce permissions" story
    story_venue_catalogue: tests for the "update venue catalogue" story (SCRUM-25)
    story_venue_calendar: tests for the "view a venue's availability calendar" story (SCRUM-26)
    story_venue_search: tests for the "search and filter venues" story (SCRUM-35)
    story_venue_setup_turnaround: tests for the "record setup and turnaround time" story (SCRUM-67)
filterwarnings =
    error::DeprecationWarning:app.*
