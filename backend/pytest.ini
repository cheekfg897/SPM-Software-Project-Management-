[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
# One marker per user story so tests can be traced back to the backlog.
markers =
    scrum_6: tests for SCRUM-6 "log in to the system"
    scrum_19: tests for SCRUM-19 "submit an event request"
    scrum_21: tests for SCRUM-21 "enforce permissions for every role"
    scrum_22: tests for SCRUM-22 "define the event status model"
    scrum_25: tests for SCRUM-25 "update venue catalogue"
    scrum_26: tests for SCRUM-26 "view a venue's availability calendar"
    scrum_27: tests for SCRUM-27 "maintain the equipment catalogue"
    scrum_28: tests for SCRUM-28 "receive notifications about my events"
    scrum_30: tests for SCRUM-30 "assign a coordinator to a submitted event"
    scrum_34: tests for SCRUM-34 "block a venue for maintenance or internal use"
    scrum_35: tests for SCRUM-35 "search and filter venues against event requirements"
    scrum_36: tests for SCRUM-36 "check whether a venue suits an event"
    scrum_37: tests for SCRUM-37 "record what equipment an event needs"
    scrum_65: tests for SCRUM-65 "create an account to access the system"
    scrum_66: tests for SCRUM-66 "record client organisations and link Organisers to them"
    scrum_67: tests for SCRUM-67 "record setup and turnaround time for a venue"
filterwarnings =
    error::DeprecationWarning:app.*
