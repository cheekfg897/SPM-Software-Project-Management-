[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
# One marker per user story so tests can be traced back to the backlog.
markers =
    scrum_6: tests for SCRUM-6 "log in to the system"
    scrum_7: tests for SCRUM-7 "see only my own organisation's events"
    scrum_19: tests for SCRUM-19 "submit an event request"
    scrum_20: tests for SCRUM-20 "save and resume a draft event request"
    scrum_21: tests for SCRUM-21 "enforce permissions for every role"
    scrum_22: tests for SCRUM-22 "define the event status model"
    scrum_24: tests for SCRUM-24 "see the events my role is involved in"
    scrum_25: tests for SCRUM-25 "update venue catalogue"
    scrum_26: tests for SCRUM-26 "view a venue's availability calendar"
    scrum_27: tests for SCRUM-27 "maintain the equipment catalogue"
    scrum_28: tests for SCRUM-28 "receive notifications about my events"
    scrum_30: tests for SCRUM-30 "assign a coordinator to a submitted event"
    scrum_31: tests for SCRUM-31 "review and decide a submitted request"
    scrum_32: tests for SCRUM-32 "ask the organiser for clarification"
    scrum_33: tests for SCRUM-33 "update event information and flag significant changes"
    scrum_34: tests for SCRUM-34 "block a venue for maintenance or internal use"
    scrum_35: tests for SCRUM-35 "search and filter venues against event requirements"
    scrum_36: tests for SCRUM-36 "check whether a venue suits an event"
    scrum_37: tests for SCRUM-37 "record what equipment an event needs"
    scrum_38: tests for SCRUM-38 "see the equipment requests awaiting my action"
    scrum_39: tests for SCRUM-39 "be notified about review and approval decisions"
    scrum_41: tests for SCRUM-41 "end-to-end test: request to approval"
    scrum_42: tests for SCRUM-42 "request a venue booking for an approved event"
    scrum_43: tests for SCRUM-43 "approve, hold or reject a venue booking"
    scrum_44: tests for SCRUM-44 "prevent the same venue being booked twice"
    scrum_45: tests for SCRUM-45 "check whether enough equipment is free"
    scrum_46: tests for SCRUM-46 "reserve equipment"
    scrum_51: tests for SCRUM-51 "end-to-end test: venue booking and conflict"
    scrum_52: tests for SCRUM-52 "register for a confirmed event"
    scrum_53: tests for SCRUM-53 "see and withdraw my registration"
    scrum_55: tests for SCRUM-55 "see who has registered for an event"
    scrum_60: tests for SCRUM-60 "reassess equipment reservations after a timing change"
    scrum_63: tests for SCRUM-63 "end-to-end test: registration and change impact"
    scrum_65: tests for SCRUM-65 "create an account to access the system"
    scrum_66: tests for SCRUM-66 "record client organisations and link Organisers to them"
    scrum_67: tests for SCRUM-67 "record setup and turnaround time for a venue"
    scrum_68: tests for SCRUM-68 "mark an event as completed after it has taken place"
    scrum_69: tests for SCRUM-69 "enable registration for an event and set its capacity"
    scrum_84: tests for SCRUM-84 "update venue preparation details"
    scrum_75: tests for SCRUM-75 "place a tentative hold on a venue"
    scrum_87: tests for SCRUM-87 "reassign an event to a different coordinator"
    scrum_88: tests for SCRUM-88 "internal staff roles can self-register"
    scrum_89: tests for SCRUM-89 "log out, so the access token stops working"
    scrum_47: tests for SCRUM-47 "take damaged equipment out of circulation"
    scrum_48: tests for SCRUM-48 "record the outcome of an equipment review"
    scrum_93: tests for SCRUM-93 "book several venues for one event"
    scrum_94: tests for SCRUM-94 "expire tentative holds automatically"
    scrum_95: tests for SCRUM-95 "newly submitted event requests go to the Event Coordinator Lead unassigned"
    scrum_96: tests for SCRUM-96 "Lead reassigns events and oversees coordinator assignments"
    scrum_97: tests for SCRUM-97 "submit an event for operational safety check"
    scrum_98: tests for SCRUM-98 "record the operational safety check outcome"
    scrum_49: tests for SCRUM-49 "confirm an event once its arrangements are in place"
    scrum_85: tests for SCRUM-85 "update equipment preparation details"
    scrum_92: tests for SCRUM-92 "flag bookings affected when a venue becomes unavailable"
    scrum_50: tests for SCRUM-50 "be notified about booking and equipment decisions"
    scrum_115: tests for SCRUM-115 "venue decision notices go to the event's current coordinator"
    scrum_5: tests for SCRUM-5 "build and test every change automatically"
    scrum_59: tests for SCRUM-59 "reconfirm or reject a booking flagged after a change"
    scrum_99: tests for SCRUM-99 "return an event to planning when the safety check is not approved"
    e2e: journeys driven through the HTTP layer with Flask's test client (SCRUM-41, ADR-0031)
filterwarnings =
    error::DeprecationWarning:app.*
