[pytest]
testpaths = tests
addopts = -ra --strict-markers
# One marker per user story so tests can be traced back to the backlog.
# TODO: replace marker/story name with the actual Jira story ID once assigned
markers =
    story_create_account: tests for the "create an account" story
    story_login: tests for the "log in" story
    story_permissions: tests for the "enforce permissions" story
filterwarnings =
    error::DeprecationWarning:app.*
